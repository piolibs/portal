; Host tests of the platform independent part (src/portal/core)
[env:native]
platform = native
build_flags =
	-std=c++2a
	-Wall
	-Wextra
	-I src
build_unflags =
	-std=gnu++17
build_src_filter = +<portal/core/*.cpp>
test_framework = unity
test_build_src = true
test_filter = test_native

; Device tests, run on a NodeMCU board
[env:board-esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_flags =
	-std=c++2a
	-D SERIAL_BAUD_RATE=74880
	-D LOG_LEVEL=4
build_unflags =
	-std=gnu++17
lib_deps =
	https://github.com/piolibs/macros.git#v1.0.2
	https://github.com/piolibs/console.git#v1.0.1
	https://github.com/piolibs/checksum.git#v1.0.0
	https://github.com/piolibs/config.git#v2.0.0
upload_speed = 115200
monitor_speed = 74880
test_speed = 74880
monitor_filters = default
	esp8266_exception_decoder
	time
monitor_rts = 0
monitor_dtr = 0
test_framework = unity
test_build_src = true
test_filter = test_device

; The example on a NodeMCU board, for test/smoke.sh
[env:example]
extends = env:board-esp8266
build_src_filter = +<portal/> +<../examples/basic/>
